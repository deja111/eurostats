name: Linije kladionica (OddsPapi)
# Svako jutro: linije kladionica + snimak svih predloga za stranicu "📊 Učinak".

on:
  schedule:
    - cron: "5 9 * * *"     # svaki dan oko 11:05 po nasem vremenu (leti), 10:05 zimi
  workflow_dispatch:         # dugme "Run workflow" za rucno pokretanje

permissions:
  contents: write

concurrency:
  group: osvezi-podatke
  cancel-in-progress: false

jobs:
  linije:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Preuzmi linije
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python oddspapi.py
      - name: Snimi predloge
        run: python snimi_predloge.py
      - name: Sacuvaj na GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add linije_oddspapi.json || true
          git add predlozi_istorija.csv || true
          if git diff --cached --quiet; then echo "Nema promena"; exit 0; fi
          git commit -m "Linije i predlozi $(date -u +%F)"
          git pull --rebase
          git push
